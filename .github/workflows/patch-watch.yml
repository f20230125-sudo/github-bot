name: Patch watch

# Patch's scheduled check, for when no desk is open. It audits the owner's public repositories
# with rules only: Claude is never called here, so there is nothing to sign in to and nothing to
# pay for. When what the public demo shows has changed, it commits the new snapshot.
#
# The job's token can read public data and write to this repository. It cannot touch any other
# repository, so Patch can only suggest here. Changes are made by the owner, on GitHub.

on:
  schedule:
    - cron: "17 */6 * * *" # every six hours, at 17 minutes past
  workflow_dispatch:

permissions:
  contents: write # to commit the snapshot to this repository

concurrency:
  group: patch-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Patch's memory between runs: what it stored about each repository, and GitHub's ETags, so a
      # check that finds nothing is one request. Without it the run is a first look.
      - name: Restore Patch's memory
        uses: actions/cache@v4
        with:
          path: backend/data
          key: patch-memory-${{ github.run_id }}
          restore-keys: patch-memory-

      - name: Check GitHub
        id: check
        env:
          DESK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESK_GITHUB_USER: ${{ github.repository_owner }}
          DESK_CLAUDE_COMMAND: "[]" # no Claude here: rules and templates only
        run: python -m app.cloud

      # Only when something the site shows has changed. A check that finds nothing commits nothing.
      - name: Publish the snapshot
        if: steps.check.outputs.published == 'true'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/showcase/snapshot.json
          git commit -m "Update the demo snapshot after a scheduled check"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
